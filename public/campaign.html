<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bushra Tech — Send Campaign</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg"></div>

  <nav>
    <a class="brand" href="/">
      <div class="mark">B</div>
      <div>
        <b>Bushra Tech</b>
        <span>Product outreach</span>
      </div>
    </a>

    <div class="links">
      <a href="/">Find Leads</a>
      <a class="on" href="/campaign.html">Send Emails</a>
    </div>
  </nav>

  <main>
    <div class="hero">
      <div class="kicker">✦ CSV in · product email out</div>
      <h1>Upload your list. <em>We send the pitch.</em></h1>
    </div>

    <section class="panel">
      <label class="drop" id="drop">
        <strong>Drop your leads CSV here</strong>
        <p>or click to upload · columns: name, email</p>
        <input id="file" type="file" accept=".csv,text/csv" hidden />
      </label>

      <div class="row">
        <button class="btn" id="send" disabled>Send product emails</button>
        <span class="status" id="mailStatus" style="margin:0"></span>
      </div>

      <p class="status" id="status">Waiting for a CSV.</p>
      <div class="bar"><i id="bar"></i></div>

      <div class="preview" style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <h3 style="margin:0;">Email Template (Editable)</h3>
          <span style="font-size:0.8rem;color:var(--muted);">Use <code>{{name}}</code> for business name</span>
        </div>

        <div>
          <label for="tmplSubject" style="margin-bottom:6px;">Subject</label>
          <input id="tmplSubject" type="text" style="width:100%;" />
        </div>

        <div>
          <label for="tmplBody" style="margin-bottom:6px;">Message Body</label>
          <textarea id="tmplBody" rows="8"></textarea>
        </div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button class="btn ghost" id="saveTmpl" type="button" style="padding:8px 16px;font-size:0.85rem;">Save Template</button>
          <button class="btn ghost" id="resetTmpl" type="button" style="padding:8px 16px;font-size:0.85rem;border-color:var(--line);color:var(--muted);">Reset Default</button>
          <span id="saveNotice" style="font-size:0.85rem;color:var(--mint);display:none;">Template saved!</span>
        </div>
      </div>

      <div class="table-wrap" style="margin-top:18px">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const drop = document.getElementById("drop");
    const file = document.getElementById("file");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const mailStatus = document.getElementById("mailStatus");
    const rows = document.getElementById("rows");
    const bar = document.getElementById("bar");
    const tmplSubject = document.getElementById("tmplSubject");
    const tmplBody = document.getElementById("tmplBody");
    const saveTmpl = document.getElementById("saveTmpl");
    const resetTmpl = document.getElementById("resetTmpl");
    const saveNotice = document.getElementById("saveNotice");

    let leads = [];

    const DEFAULT_TMPL = {
      subject: "A product partner for {{name}} — Bushra Tech",
      body: `Hello {{name}},

Bushra Technology & Services is an AI SaaS product partner — we design, build, and ship intelligent software for founders and enterprises, from first idea to scale.

We help companies like yours with:
• Custom software development
• AI solutions and automation
• Cloud, mobile apps, and Web3 products

We've shipped products that grow, including SMART Insight (AI business intelligence) and Next Global Express (logistics tracking & CRM), plus a legal SaaS platform now valued at $35M.

If you are exploring a new product, AI inside an existing workflow, or a rebuild that needs to hold up in production, we would be glad to talk.

See our work: https://bushratech.com

Warm regards,
Bushra Tech
https://bushratech.com`
    };

    function loadTemplate() {
      try {
        const saved = JSON.parse(localStorage.getItem("bushra_email_tmpl") || "null");
        if (saved && saved.subject && saved.body) {
          tmplSubject.value = saved.subject;
          tmplBody.value = saved.body;
          return;
        }
      } catch {}

      tmplSubject.value = DEFAULT_TMPL.subject;
      tmplBody.value = DEFAULT_TMPL.body;
    }

    loadTemplate();

    saveTmpl.onclick = () => {
      localStorage.setItem("bushra_email_tmpl", JSON.stringify({
        subject: tmplSubject.value.trim() || DEFAULT_TMPL.subject,
        body: tmplBody.value.trim() || DEFAULT_TMPL.body
      }));

      saveNotice.style.display = "inline";
      setTimeout(() => { saveNotice.style.display = "none"; }, 2500);
    };

    resetTmpl.onclick = () => {
      localStorage.removeItem("bushra_email_tmpl");
      tmplSubject.value = DEFAULT_TMPL.subject;
      tmplBody.value = DEFAULT_TMPL.body;
    };

    fetch("/api/mail-ready").then(r => r.json()).then(j => {
      mailStatus.textContent = j.ready ? "Mailbox ready" : "Add SMTP_USER and SMTP_PASS in .env";
      mailStatus.className = "chip " + (j.ready ? "ok" : "bad");
    });

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    }

    function chip(st) {
      const cls = st === "sent" ? "ok" : st === "failed" || st === "skipped" ? "bad" : "wait";
      return `<span class="chip ${cls}">${esc(st)}</span>`;
    }

    function render() {
      rows.innerHTML = leads.map(l => `<tr><td>${esc(l.name || "—")}</td><td>${esc(l.email)}</td><td>${chip(l.status || "queued")}</td></tr>`).join("");
      send.disabled = !leads.length;
    }

    function parseCsv(text) {
      const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(Boolean);
      if (!lines.length) return [];

      const cells = (line) => {
        const out = [];
        let cur = "", q = false;

        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') { q = !q; continue; }
          if (c === "," && !q) { out.push(cur.trim()); cur = ""; continue; }
          cur += c;
        }

        out.push(cur.trim());
        return out;
      };

      const head = cells(lines[0]).map(h => h.toLowerCase());
      const ei = head.findIndex(h => h.includes("email"));
      const ni = head.findIndex(h => h.includes("name"));
      const start = ei >= 0 ? 1 : 0;
      const emailIdx = ei >= 0 ? ei : (head.length > 1 ? 1 : 0);
      const nameIdx = ni >= 0 ? ni : 0;

      const seen = new Set();
      const list = [];

      for (let i = start; i < lines.length; i++) {
        const cols = cells(lines[i]);
        const email = (cols[emailIdx] || "").toLowerCase();
        if (!email.includes("@") || seen.has(email)) continue;
        seen.add(email);
        list.push({ name: cols[nameIdx] || "", email, status: "queued" });
      }

      return list;
    }

    drop.onclick = () => file.click();

    drop.ondragover = (e) => {
      e.preventDefault();
      drop.classList.add("hot");
    };

    drop.ondragleave = () => drop.classList.remove("hot");

    drop.ondrop = (e) => {
      e.preventDefault();
      drop.classList.remove("hot");
      if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
    };

    file.onchange = () => {
      if (file.files[0]) readFile(file.files[0]);
    };

    function readFile(f) {
      const reader = new FileReader();

      reader.onload = () => {
        leads = parseCsv(String(reader.result || ""));
        status.textContent = leads.length ? `${leads.length} unique emails ready to send.` : "No emails found in that CSV.";
        bar.style.width = "0";
        render();
      };

      reader.readAsText(f);
    }

    send.onclick = async () => {
      send.disabled = true;
      status.textContent = "Sending…";

      const customTemplate = {
        subject: tmplSubject.value.trim() || DEFAULT_TMPL.subject,
        body: tmplBody.value.trim() || DEFAULT_TMPL.body
      };

      const res = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          leads: leads.map(({ name, email }) => ({ name, email })),
          customTemplate
        }),
      });

      if (!res.body) {
        status.textContent = "Send failed.";
        send.disabled = false;
        return;
      }

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        buf += dec.decode(value || new Uint8Array(), { stream: !done });
        const parts = buf.split("\n");
        buf = parts.pop() || "";

        for (const line of parts) {
          if (!line.trim()) continue;
          const d = JSON.parse(line);
          if (d.error) status.textContent = d.error;

          if (d.email) {
            const item = leads.find(l => l.email === d.email);
            if (item) item.status = d.status;
          }

          if (typeof d.sent === "number") {
            bar.style.width = Math.min(100, (d.doneCount / d.total) * 100) + "%";
            status.textContent = `Sent ${d.sent}/${d.total} · failed ${d.failed} · skipped ${d.skipped}`;
          }

          render();
        }

        if (done) break;
      }

      send.disabled = false;
    };
  </script>
</body>
</html>
